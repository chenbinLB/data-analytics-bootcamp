name: Build and Deploy Course Site

on:
  push:
    branches: [main]
    paths:
      - 'module_*/**'
      - '.github/workflows/site.yml'
      - 'promo/01_*.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert jinja2

      - name: Build site (HTML + index)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p _site
          mkdir -p _site/notebooks

          # 1. 生成主页
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>大厂数据分析师 4 周突击课 | chenbinLB</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; }
              body {
                font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
                background: linear-gradient(135deg, #0d1b2a 0%, #1b3a4b 100%);
                color: #e0e1dd; min-height: 100vh; padding: 40px 20px;
              }
              .container { max-width: 1200px; margin: 0 auto; }
              header {
                text-align: center; padding: 40px 20px; margin-bottom: 40px;
                background: rgba(255,255,255,0.05); border-radius: 16px;
                backdrop-filter: blur(10px);
              }
              h1 { font-size: 2.5em; color: #3da9fc; margin-bottom: 10px; }
              .tagline { color: #a8dadc; font-size: 1.2em; margin-bottom: 20px; }
              .badges { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
              .badge {
                background: #06d6a0; color: white; padding: 5px 15px; border-radius: 20px;
                font-size: 0.9em; font-weight: bold;
              }
              .badge.price { background: #ef476f; }
              .weeks {
                display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 20px; margin-bottom: 40px;
              }
              .week-card {
                background: rgba(255,255,255,0.08); border-radius: 12px; padding: 25px;
                border: 1px solid rgba(61,169,252,0.3);
                transition: all 0.3s; cursor: pointer; text-decoration: none; color: inherit;
                display: block;
              }
              .week-card:hover {
                transform: translateY(-5px);
                background: rgba(61,169,252,0.15);
                border-color: #3da9fc;
              }
              .week-label {
                display: inline-block; background: #3da9fc; color: white;
                padding: 4px 12px; border-radius: 12px; font-weight: bold;
                margin-bottom: 15px;
              }
              .week-title { font-size: 1.4em; margin-bottom: 10px; color: white; }
              .week-desc { color: #a8dadc; font-size: 0.95em; line-height: 1.5; }
              .week-files { margin-top: 15px; font-size: 0.85em; color: #778da9; }
              .cta {
                text-align: center; padding: 30px; background: rgba(239,71,111,0.15);
                border-radius: 12px; border: 2px solid #ef476f; margin-top: 40px;
              }
              .cta h2 { color: #ef476f; margin-bottom: 15px; }
              .cta p { margin-bottom: 20px; line-height: 1.6; }
              .cta-btn {
                display: inline-block; background: #ef476f; color: white;
                padding: 12px 30px; border-radius: 30px; text-decoration: none;
                font-weight: bold; font-size: 1.1em;
              }
              .footer { text-align: center; padding: 30px; color: #778da9; font-size: 0.9em; }
              .footer a { color: #3da9fc; text-decoration: none; }
              .run-link {
                display: inline-block; background: #06d6a0; color: white;
                padding: 8px 16px; border-radius: 20px; text-decoration: none;
                font-size: 0.85em; margin-left: 10px; font-weight: bold;
              }
              .run-link:hover { background: #05b386; }
            </style>
          </head>
          <body>
            <div class="container">
              <header>
                <h1>📊 大厂数据分析师 4 周突击课</h1>
                <p class="tagline">15 个跑通的 Jupyter notebook · 真实数据集 · 零环境门槛</p>
                <div class="badges">
                  <span class="badge">Python 3.10+</span>
                  <span class="badge">SQL 大厂真题</span>
                  <span class="badge">真实业务数据</span>
                  <span class="badge price">¥49.9</span>
                </div>
              </header>

              <h2 style="margin-bottom: 20px; color: #3da9fc;">📚 4 周学习路径</h2>
              <div class="weeks">
                <a href="https://github.com/chenbinLB/data-analytics-bootcamp/blob/main/module_00_prep/00_小白预备周.ipynb" class="week-card" target="_blank">
                  <div class="week-label">W0 预备周</div>
                  <div class="week-title">小白预备周</div>
                  <div class="week-desc">装环境、跑通第一个程序、心里有底。3-4 小时学完。</div>
                  <div class="week-files">📓 1 个 notebook · 6 cells</div>
                </a>

                <a href="https://github.com/chenbinLB/data-analytics-bootcamp/tree/main/module_01_sql" class="week-card" target="_blank">
                  <div class="week-label">W1 SQL</div>
                  <div class="week-title">SQL 大厂真题</div>
                  <div class="week-desc">基础 + JOIN + 窗口函数 + CTE + 留存/漏斗/连续登录。50+ 真题。</div>
                  <div class="week-files">📓 4 个 notebook · 93 cells</div>
                </a>

                <a href="https://github.com/chenbinLB/data-analytics-bootcamp/tree/main/module_02_python" class="week-card" target="_blank">
                  <div class="week-label">W2 Python</div>
                  <div class="week-title">Python 数据处理</div>
                  <div class="week-desc">NumPy / Pandas / 清洗 / 时间序列 / 可视化。真实数据实战。</div>
                  <div class="week-files">📓 5 个 notebook · 56 cells</div>
                </a>

                <a href="https://github.com/chenbinLB/data-analytics-bootcamp/tree/main/module_03_stats" class="week-card" target="_blank">
                  <div class="week-label">W3 统计</div>
                  <div class="week-title">统计 + A/B 测试</div>
                  <div class="week-desc">假设检验、A/B 实验设计、指标体系、异动归因、5 段式报告。</div>
                  <div class="week-files">📓 3 个 notebook · 20 cells</div>
                </a>

                <a href="https://github.com/chenbinLB/data-analytics-bootcamp/tree/main/module_04_projects" class="week-card" target="_blank">
                  <div class="week-label">W4 求职</div>
                  <div class="week-title">实战项目 + 求职</div>
                  <div class="week-desc">完整电商项目、简历模板、面试题库、求职时间线。</div>
                  <div class="week-files">📓 2 个 notebook · 11 cells</div>
                </a>
              </div>

              <div class="cta">
                <h2>🚀 怎么开始?</h2>
                <p>点上面的卡片,直接在 GitHub 看 notebook 内容。<br>
                  想本地跑? 克隆仓库,跑 <code>python setup_env.py</code> 一键安装。</p>
                <a href="https://github.com/chenbinLB/data-analytics-bootcamp" class="cta-btn" target="_blank">📦 克隆仓库</a>
              </div>

              <div class="footer">
                <p>由 <a href="https://github.com/chenbinLB">chenbinLB</a> 制作 · MIT License</p>
                <p style="margin-top: 10px;">课程价格:¥49.9 · 加微信咨询详情</p>
              </div>
            </div>
          </body>
          </html>
          HTML

          # 2. 把每个 notebook 复制到 _site/notebooks/(供下载)
          cp -r module_00_prep/*.ipynb _site/notebooks/
          cp -r module_01_sql/*.ipynb _site/notebooks/
          cp -r module_02_python/*.ipynb _site/notebooks/
          cp -r module_03_stats/*.ipynb _site/notebooks/
          cp -r module_04_projects/*.ipynb _site/notebooks/

          # 3. README 同步到 _site
          cp README.md _site/README.md

          echo "===== _site 内容 ====="
          ls -la _site/
          echo ""
          echo "===== _site/notebooks 文件数 ====="
          find _site/notebooks/ -name "*.ipynb" | wc -l
          echo ""
          echo "===== _site 总大小 ====="
          du -sh _site/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: site build ${{ github.run_id }}"

  enable-pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pages \
            -f source[branch]=gh-pages \
            -f source[path]=/ \
            -f build_type=workflow \
            > /dev/null 2>&1 || echo "Pages already enabled (skip)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
