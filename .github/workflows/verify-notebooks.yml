name: Verify Notebooks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest  # 用 Linux,完全无编码问题

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate data (if missing)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ ! -f "data/ecommerce.db" ]; then
            python module_01_sql/setup_data.py
          fi

      - name: Run notebook verification
        env:
          MPLBACKEND: Agg
          PYTHONIOENCODING: utf-8
        run: |
          python -c "
          import subprocess, sys
          from pathlib import Path
          failed = 0
          total = 0
          for nb_path in sorted(Path('.').glob('module_*/*.ipynb')):
              total += 1
              print(f'\\n===== {nb_path.name} =====')
              r = subprocess.run([sys.executable, 'verify.py', str(nb_path)],
                                  capture_output=True, text=True, timeout=120)
              print(r.stdout)
              if r.returncode != 0:
                  print('STDERR:', r.stderr[:500])
                  failed += 1
          print(f'\\n---> {total - failed}/{total} notebooks passed')
          sys.exit(0 if failed == 0 else 1)
          "
