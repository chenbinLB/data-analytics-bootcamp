name: Build and Deploy JupyterLite

on:
  push:
    branches: [main]
    paths:
      - 'module_*/**'
      - 'jupyterlite/**'
      - '.github/workflows/jupyterlite.yml'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install JupyterLite
        run: |
          python -m pip install --upgrade pip
          pip install "jupyterlite==0.4.0" "jupyterlite-pyodide-kernel==0.4.0"

      - name: Build JupyterLite site
        run: |
          # 把所有 notebook 复制到 jupyterlite/content
          mkdir -p jupyterlite/content
          cp -r module_00_prep/*.ipynb jupyterlite/content/
          cp -r module_01_sql/*.ipynb jupyterlite/content/
          cp -r module_02_python/*.ipynb jupyterlite/content/
          cp -r module_03_stats/*.ipynb jupyterlite/content/
          cp -r module_04_projects/*.ipynb jupyterlite/content/

          # 数据文件(可选,小数据可加;26MB 太大,先不放,用户在 notebook 里跑 setup)
          # mkdir -p jupyterlite/content/data
          # cp data/ecommerce.db jupyterlite/content/data/

          # 生成 JupyterLite 配置
          cat > jupyterlite_config.json <<'EOF'
          {
            "jupyterLiteConfig": {
              "enableMemoryStorage": true,
              "federated_extensions": []
            },
            "litePluginSettings": {
              "@jupyterlite/pyodide-kernel-extension:kernel": {
                "pyodideUrl": "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"
              }
            }
          }
          EOF

          # 构建
          cd jupyterlite
          jupyter lite build --output-dir dist --apps lab
          cd ..

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jupyterlite/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
