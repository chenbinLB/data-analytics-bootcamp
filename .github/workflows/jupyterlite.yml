name: Build and Deploy JupyterLite

on:
  push:
    branches: [main]
    paths:
      - 'module_*/**'
      - '.github/workflows/jupyterlite.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JupyterLite
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          pip install "jupyterlite==0.4.0" "jupyterlite-pyodide-kernel==0.4.0"

      - name: Build JupyterLite site
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 方法 1:用 --contents 参数(0.4.0 支持)
          # 文档:jupyter lite build --help
          # 实际:0.4.x 没有 --contents,只有 --extra-ignore-contents

          # 方法 2:把 notebook 复制到 'content' 目录(JupyterLite 默认)
          # 实际:JupyterLite 0.4.x 不再用 'content',改用 federated_extensions + 'files'

          # 方法 3:用 jupyter lite addcontents(官方推荐)
          # 先建空 site
          jupyter lite build --output-dir dist --apps lab

          # 把 notebook 加到 dist 里
          jupyter lite addcontents dist \
            module_00_prep/*.ipynb \
            module_01_sql/*.ipynb \
            module_02_python/*.ipynb \
            module_03_stats/*.ipynb \
            module_04_projects/*.ipynb

          echo ""
          echo "===== dist/tree 目录 ====="
          ls -la dist/tree/ 2>&1 | head -20
          echo ""
          echo "===== dist 总大小 ====="
          du -sh dist/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: JupyterLite build ${{ github.run_id }}"

  enable-pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pages \
            -f source[branch]=gh-pages \
            -f source[path]=/ \
            -f build_type=workflow \
            > /dev/null 2>&1 || echo "Pages already enabled (skip)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
