name: Build and Deploy JupyterLite

on:
  push:
    branches: [main]
    paths:
      - 'module_*/**'
      - '.github/workflows/jupyterlite.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JupyterLite
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          # 0.1.x 系列是老 API,简单可靠
          # content/ 目录直接放 notebook 就行
          pip install "jupyterlite==0.1.0" "jupyterlite-pyodide-kernel==0.1.0"

      - name: Build JupyterLite site
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 老 API:把所有 notebook 复制到 ./content 目录(JupyterLite 0.1.x 默认找这里)
          mkdir -p content
          cp -r module_00_prep/*.ipynb content/
          cp -r module_01_sql/*.ipynb content/
          cp -r module_02_python/*.ipynb content/
          cp -r module_03_stats/*.ipynb content/
          cp -r module_04_projects/*.ipynb content/

          echo "===== content 目录 ====="
          ls -la content/ | head -20
          echo ""
          echo "===== 总文件数 ====="
          find content/ -name "*.ipynb" | wc -l

          # 构建
          jupyter lite build --output-dir dist --apps lab

          echo ""
          echo "===== dist/tree 目录 ====="
          ls -la dist/tree/ 2>&1 | head -30
          echo ""
          echo "===== dist 总大小 ====="
          du -sh dist/

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: JupyterLite build ${{ github.run_id }}"

  enable-pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pages \
            -f source[branch]=gh-pages \
            -f source[path]=/ \
            -f build_type=workflow \
            > /dev/null 2>&1 || echo "Pages already enabled (skip)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
