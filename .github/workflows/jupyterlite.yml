name: Build and Deploy JupyterLite

on:
  push:
    branches: [main]
    paths:
      - 'module_*/**'
      - '.github/workflows/jupyterlite.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# 避免并发部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JupyterLite
        run: |
          python -m pip install --upgrade pip
          pip install "jupyterlite==0.4.0" "jupyterlite-pyodide-kernel==0.4.0"

      - name: Build JupyterLite site
        env:
          PYTHONIOENCODING: utf-8
        run: |
          mkdir -p jupyterlite/content
          cp -r module_00_prep/*.ipynb jupyterlite/content/
          cp -r module_01_sql/*.ipynb jupyterlite/content/
          cp -r module_02_python/*.ipynb jupyterlite/content/
          cp -r module_03_stats/*.ipynb jupyterlite/content/
          cp -r module_04_projects/*.ipynb jupyterlite/content/

          cat > jupyterlite/jupyter_lite_config.json <<'EOF'
          {
            "jupyterLiteConfig": {
              "enableMemoryStorage": true
            },
            "litePluginSettings": {
              "@jupyterlite/pyodide-kernel-extension:kernel": {
                "pyodideUrl": "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"
              }
            }
          }
          EOF

          cd jupyterlite
          jupyter lite build --output-dir dist --apps lab
          cd ..

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./jupyterlite/dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: JupyterLite build ${{ github.run_id }}"

  enable-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pages \
            -f source[branch]=gh-pages \
            -f source[path]=/ \
            -f build_type=workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
