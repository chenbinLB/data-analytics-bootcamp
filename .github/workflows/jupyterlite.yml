name: Build and Deploy JupyterLite

on:
  push:
    branches: [main]
    paths:
      - 'module_*/**'
      - '.github/workflows/jupyterlite.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install JupyterLite
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --upgrade pip
          pip install "jupyterlite==0.4.0" "jupyterlite-pyodide-kernel==0.4.0"

      - name: Build JupyterLite site
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # 在 jupyter-lite.json 里配置 contents 目录
          # 这是 JupyterLite 官方推荐的方式
          cat > jupyter-lite.json <<'EOF'
          {
            "jupyter-lite-schema-version": 0,
            "jupyter_config_data": {
              "contentsManagerOptions": {
                "manager": "notebook"
              }
            },
            "contents": [
              "module_00_prep/*.ipynb",
              "module_01_sql/*.ipynb",
              "module_02_python/*.ipynb",
              "module_03_stats/*.ipynb",
              "module_04_projects/*.ipynb"
            ]
          }
          EOF

          echo "===== jupyter-lite.json ====="
          cat jupyter-lite.json
          echo ""
          echo "===== 验证 notebook 文件存在 ====="
          ls -la module_00_prep/*.ipynb module_01_sql/*.ipynb 2>&1 | head -10
          echo ""

          # 直接在仓库根目录 build,contents 路径相对于 cwd
          jupyter lite build --output-dir dist --apps lab

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: JupyterLite build ${{ github.run_id }}"

  enable-pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Enable GitHub Pages
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/pages \
            -f source[branch]=gh-pages \
            -f source[path]=/ \
            -f build_type=workflow \
            > /dev/null 2>&1 || echo "Pages already enabled (skip)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
